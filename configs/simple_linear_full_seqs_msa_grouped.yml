experiment:
  name: "Simple Linear Full Seqs MSA Grouped"
  seed: 999

model:
  module: "models.simple_linear"
  class_name: "SimpleLinearClassifier"
  uses_attention: false

data:
  dataset_type: "full_seqs"

embedder:
  name: "msa_transformer"
  use_msa_mode: true

evaluation:
  mode: "grouped"
  test_data: "Explain_humanCldn2-10a-15-17.fasta"
  test_data_labels: [1, 2, 2, 1] # {0: 'barrier', 1: 'cation', 2: 'anion'} optional

path:
  runs_root: "/content/drive/MyDrive/Thesis data/runs"

hyperparameters:
  # Whether to run hyperparameter tuning for grouped holdout or provide custom set of values
  use_custom_hyperparameters: true
  # If not running hyperparameter tuning, these values will be used directly for training and evaluation
  # Else leave empty
  optimizer_lr: 1e-3
  optimizer_weight_decay: 1e-3
  schedular_patience: 10
  warmup_epochs: 5
  useWeightedSampler: false
  weighted_ce_power: -1.0
  num_epochs: 50
  batch_size: 64
  patience: 8